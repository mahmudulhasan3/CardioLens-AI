<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            color-scheme: light;
            --fg: #7b8492;
            --hover: rgba(128, 128, 128, .13);
            --ok: #16a34a;
            --accent: #3b82f6;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0 !important;
            padding: 0 !important;
            background: transparent !important;
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        body {
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            overflow: hidden;
        }

        .bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 3px;
            width: 100%;
            min-height: 36px;
            padding: 2px 0;
            margin: 0;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 34px;
            width: 34px;
            height: 34px;
            padding: 7px;
            border: 1px solid transparent !important;
            border-radius: 10px;
            background: transparent !important;
            box-shadow: none !important;
            cursor: pointer;
            transition:
                background .15s ease,
                transform .15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            background: var(--hover) !important;
            border-color: transparent !important;
        }

        button:active {
            transform: scale(.94);
        }

        button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        svg {
            display: block;
            width: 19px;
            height: 19px;
            fill: var(--fg);
            transition: fill .15s ease;
        }

        button.on {
            background: transparent !important;
        }

        button.on svg {
            fill: var(--accent);
        }

        button.ok svg {
            fill: var(--ok);
        }

        button.flip svg {
            transform: rotate(180deg);
        }

        button.spin svg {
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                transition: none !important;
                animation-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="bar" id="bar" role="toolbar" aria-label="Answer actions"></div>

    <script>
        const ICON = {
            copy: "M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z",

            check: "M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z",

            speak: "M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z",

            up: "M9 21h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2zM9 9l4.34-4.34L12 10h9v2l-3 7H9V9zM1 9h4v12H1V9z",

            upFilled: "M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z",

            refresh: "M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z",

            share: "M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z",

            download: "M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"
        };

        const svg = (path) =>
            `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${path}"/></svg>`;

        let args = {
            text: "",
            footer: "",
            can_retry: false,
            rating: null
        };

        let speaking = false;
        const bar = document.getElementById("bar");

        function send(type, data) {
            window.parent.postMessage(
                {
                    isStreamlitMessage: true,
                    type,
                    ...data
                },
                "*"
            );
        }

        function emit(payload) {
            payload.n = Date.now() + Math.random();

            send("streamlit:setComponentValue", {
                value: payload,
                dataType: "json"
            });
        }

        function makeButton(title, iconPath, extraClass = "") {
            const button = document.createElement("button");

            button.type = "button";
            button.title = title;
            button.setAttribute("aria-label", title);

            if (extraClass) {
                button.className = extraClass;
            }

            button.innerHTML = svg(iconPath);
            bar.appendChild(button);

            return button;
        }

        const btn = {
            copy: makeButton("Copy answer", ICON.copy),
            speak: makeButton("Listen to answer", ICON.speak),
            up: makeButton("Good answer", ICON.up),
            down: makeButton("Poor answer", ICON.up, "flip"),
            retry: makeButton("Analyze again", ICON.refresh),
            share: makeButton("Share answer", ICON.share),
            download: makeButton("Download answer as text", ICON.download)
        };

        function flashTick(button, originalIcon) {
            button.classList.add("ok");
            button.innerHTML = svg(ICON.check);

            setTimeout(() => {
                button.classList.remove("ok");
                button.innerHTML = svg(originalIcon);
            }, 1400);
        }

        async function copyText(value) {
            try {
                await navigator.clipboard.writeText(value);
            } catch (_) {
                const area = document.createElement("textarea");

                area.value = value;
                area.style.position = "fixed";
                area.style.opacity = "0";

                document.body.appendChild(area);
                area.select();
                document.execCommand("copy");
                area.remove();
            }
        }

        btn.copy.onclick = async () => {
            await copyText(args.text);
            flashTick(btn.copy, ICON.copy);
        };

        btn.speak.onclick = () => {
            if (!("speechSynthesis" in window)) return;

            if (speaking) {
                speechSynthesis.cancel();
                speaking = false;
                btn.speak.classList.remove("on");
                return;
            }

            const clean = args.text.replace(/[*_`#>]/g, "");
            const utterance = new SpeechSynthesisUtterance(clean);

            utterance.lang =
                /[\u0980-\u09FF]/.test(args.text) ? "bn-BD" : "en-US";

            const done = () => {
                speaking = false;
                btn.speak.classList.remove("on");
            };

            utterance.onend = done;
            utterance.onerror = done;

            speaking = true;
            btn.speak.classList.add("on");
            speechSynthesis.speak(utterance);
        };

        function paintRating() {
            btn.up.classList.toggle("on", args.rating === "up");
            btn.down.classList.toggle("on", args.rating === "down");

            btn.up.innerHTML = svg(
                args.rating === "up" ? ICON.upFilled : ICON.up
            );

            btn.down.innerHTML = svg(
                args.rating === "down" ? ICON.upFilled : ICON.up
            );
        }

        btn.up.onclick = () => {
            args.rating = args.rating === "up" ? null : "up";
            paintRating();
            emit({ action: "rate", value: args.rating });
        };

        btn.down.onclick = () => {
            args.rating = args.rating === "down" ? null : "down";
            paintRating();
            emit({ action: "rate", value: args.rating });
        };

        btn.retry.onclick = () => {
            btn.retry.classList.add("spin");
            emit({ action: "retry" });
        };

        btn.share.onclick = async () => {
            const fullText = args.text + args.footer;

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: "CardioLens AI",
                        text: fullText
                    });
                    return;
                } catch (error) {
                    if (error.name === "AbortError") return;
                }
            }

            await copyText(fullText);
            flashTick(btn.share, ICON.share);
        };

        btn.download.onclick = () => {
            const blob = new Blob(
                [args.text + args.footer],
                { type: "text/plain;charset=utf-8" }
            );

            const url = URL.createObjectURL(blob);
            const anchor = document.createElement("a");

            anchor.href = url;
            anchor.download = "cardiolens_explanation.txt";

            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();

            setTimeout(() => URL.revokeObjectURL(url), 1000);
            flashTick(btn.download, ICON.download);
        };

        window.addEventListener("message", (event) => {
            if (!event.data || event.data.type !== "streamlit:render") {
                return;
            }

            const next = event.data.args || {};

            if (
                args.text &&
                next.text !== args.text &&
                "speechSynthesis" in window
            ) {
                speechSynthesis.cancel();
                speaking = false;
                btn.speak.classList.remove("on");
            }

            args = { ...args, ...next };

            btn.retry.style.display =
                args.can_retry ? "inline-flex" : "none";

            btn.retry.classList.remove("spin");
            paintRating();

            send("streamlit:setFrameHeight", { height: 40 });
        });

        send("streamlit:componentReady", { apiVersion: 1 });
    </script>
</body>

</html>
